# 최소한의 CI. 무거우면 아무도 안 고치므로 일부러 가볍게 유지한다.
# 외부 API(Claude·Google)는 부르지 않는다 — 테스트는 전부 목/모의 경로로 돈다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 린트 (리포 전체)
        run: ruff check .

      - name: 포맷 검사
        run: ruff format --check .

      - name: 테스트
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 의존성 설치
        run: npm ci

      - name: 포맷 검사
        run: npm run format:check

      - name: 타입 체크 + 빌드
        run: npm run build

      - name: 테스트
        run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env 커밋 여부 확인
        run: |
          if git ls-files | grep -Eq "(^|/)\.env(\.local)?$"; then
            echo "::error::.env 파일이 커밋되어 있습니다. 즉시 제거하고 키를 재발급하세요."
            exit 1
          fi
